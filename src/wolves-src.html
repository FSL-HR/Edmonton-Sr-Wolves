<title>Edmonton Sr Wolves</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Saira+Condensed:wght@600;700;800&display=swap">
<style id="wolves-style">
/* Layout: crest header over a sticky tab rail; each tab is a stack of panels on black ice */
:root{
  --ink:#0b0a0f; --panel:#15131c; --panel2:#1c1926; --line:#2b2737; --fg:#f4f2f8; --muted:#a39eb2;
  --purple:#6f45cf; --purple-hi:#a57cff; --purple-deep:#2a1a52; --silver:#cfcfd6;
  --ok:#46d39a; --warn:#f2b84b; --bad:#ff6b7a;
  --display:'Saira Condensed','Arial Narrow',sans-serif; --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ink);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--purple-hi);outline-offset:2px}

/* header */
.crest{background:radial-gradient(120% 140% at 0% 0%,var(--purple-deep) 0%,var(--ink) 62%);border-bottom:1px solid var(--line)}
.crest .wrap{display:flex;gap:18px;align-items:center;padding-block:18px 16px;flex-wrap:wrap}
.crest img{width:76px;height:76px;border-radius:14px;flex:none}
.crest h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,42px);line-height:1;letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
.crest h1 span{color:var(--purple-hi)}
.crest .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.crest .grow{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--muted);background:var(--panel)}
.chip b{color:var(--fg);font-variant-numeric:tabular-nums}

/* tabs */
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--ink) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.rail .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:8px}
.rail .wrap::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:8px 12px;border-radius:8px;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tab:hover{color:var(--fg);background:var(--panel)}
.tab[aria-selected="true"]{color:#fff;background:var(--purple)}

main .wrap{padding-block:22px 120px;display:grid;gap:18px}
.sec-head{display:flex;align-items:end;gap:12px;flex-wrap:wrap}
.sec-head h2{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;letter-spacing:.03em;text-transform:uppercase;margin:0;flex:1;min-width:0}
.sec-head p{margin:4px 0 0;color:var(--muted);font-size:14px}
h3{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.05em;text-transform:uppercase;margin:0 0 10px;color:var(--silver)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:4px;min-width:0}
.tile .k{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--display);font-weight:800;font-size:32px;line-height:1.05;font-variant-numeric:tabular-nums}
.tile .s{font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--purple-hi);border-radius:6px}
.bar.ok i{background:var(--ok)}

/* next game */
.next{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:linear-gradient(135deg,var(--purple-deep),var(--panel) 70%);border:1px solid var(--line);border-radius:14px;padding:18px}
.datebox{width:78px;text-align:center;border:1px solid var(--purple);border-radius:12px;padding:8px 4px;background:var(--ink)}
.datebox .m{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--purple-hi);font-weight:700}
.datebox .d{font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
.datebox .w{font-size:12px;color:var(--muted)}
.next .t{font-family:var(--display);font-weight:800;font-size:clamp(22px,4vw,30px);line-height:1.05;text-transform:uppercase}
.next .facts{display:flex;gap:6px 16px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-top:6px}
.next .facts b{color:var(--fg);font-weight:600}

/* tables */
.tw{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
td.nw{white-space:nowrap}
tr.cat td{background:var(--panel2);font-weight:600}
tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.editing tr[data-edit]{cursor:pointer}
.editing tr[data-edit]:hover td{background:var(--panel2)}
.sub{color:var(--muted);font-size:13px}
.jersey{display:inline-grid;place-items:center;min-width:32px;height:26px;padding:0 6px;border-radius:6px;background:var(--purple-deep);color:var(--purple-hi);font-family:var(--display);font-weight:800;font-size:16px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid currentColor}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.mute{color:var(--muted)} .pill.pu{color:var(--purple-hi)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.list{display:grid;gap:8px}
.li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .l{min-width:0}

/* contact cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:6px;min-width:0}
.card .nm{font-weight:700;font-size:17px}
.card .rl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--purple-hi);font-weight:700}
.cline{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:14px;min-width:0}
.cline span{user-select:all;overflow-wrap:anywhere;min-width:0}

/* gamesheets */
.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px;margin-top:10px}
.sheet{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--ink);display:grid}
.sheet a{display:block;color:var(--fg);text-decoration:none}
.sheet img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--panel2)}
.sheet .pdf{aspect-ratio:3/4;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:26px;color:var(--purple-hi);background:var(--panel2)}
.sheet .cap{padding:6px 8px;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--purple-hi)}
.btn.pri{background:var(--purple);border-color:var(--purple);color:#fff}
.btn.pri:hover{background:var(--purple-hi);border-color:var(--purple-hi);color:var(--ink)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn.danger.arm{background:var(--bad);color:var(--ink);border-color:var(--bad)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.ed-only{display:none}
.editing .ed-only{display:revert}
.editing .acts.ed-only,.editing .ed-only.acts{display:flex}

/* save bar */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel2);border-top:1px solid var(--purple);padding-bottom:env(safe-area-inset-bottom,0px)}
.savebar .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:10px}
.savebar .msg{flex:1;min-width:0;font-size:14px}
.savebar .msg b{color:var(--purple-hi)}
.modebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* modal */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(5,4,8,.72);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px}
.modal h3{margin:0;color:var(--fg);font-size:22px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.fld{display:grid;gap:4px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fld .hint{font-size:12px;color:var(--muted)}
.fld input:not([type=checkbox]),.fld select,.fld textarea{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.fld textarea{min-height:80px;resize:vertical}
.fld.chk{grid-auto-flow:column;justify-content:start;align-items:center;gap:8px}
.fld.chk input{width:20px;height:20px;accent-color:var(--purple)}
.modal .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.modal .sp{flex:1}
.err{color:var(--bad);font-size:13px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--ink);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
.foot{color:var(--muted);font-size:13px;text-align:center}

/* ask */
.askfab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:22;display:flex;align-items:center;gap:8px;border:1px solid var(--purple-hi);background:var(--purple);color:#fff;border-radius:999px;padding:11px 18px 11px 14px;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.askfab:hover{background:var(--purple-hi);color:var(--ink)}
.askfab svg{width:20px;height:20px}
body.hasbar .askfab{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.askdrawer{position:fixed;top:0;right:0;bottom:0;z-index:26;width:min(460px,100%);background:var(--panel);border-left:1px solid var(--line);display:grid;grid-template-rows:auto 1fr auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);box-shadow:-12px 0 40px rgba(0,0,0,.55)}
.askdrawer.drag{outline:3px dashed var(--purple-hi);outline-offset:-10px}
.askhd{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.askhd h3{margin:0;flex:1;color:var(--fg)}
.asklog{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:0}
.msg{max-width:92%;padding:10px 13px;border-radius:12px;font-size:14.5px;line-height:1.5;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--purple-deep);border:1px solid var(--purple)}
.msg.ai{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
.msg.ai ul{margin:6px 0;padding-left:20px}
.msg.ai p{margin:0 0 8px}.msg.ai p:last-child{margin:0}
.msg .st{color:var(--muted);font-style:italic}
.msg .er{color:var(--bad);font-size:13px;margin-top:6px}
.msg .fl{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.msg .fl span,.attchips span{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--ink);border:1px solid var(--line);color:var(--silver)}
.msg .un{margin-top:8px}
.note{align-self:center;font-size:12.5px;color:var(--muted);text-align:center}
.askintro{color:var(--muted);font-size:14px;display:grid;gap:10px}
.askintro b{color:var(--fg)}
.sugs{display:grid;gap:6px}
.sug{text-align:left;border:1px solid var(--line);background:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:14px}
.sug:hover{border-color:var(--purple-hi)}
.askft{border-top:1px solid var(--line);padding:12px 16px;display:grid;gap:8px}
.attchips{display:flex;flex-wrap:wrap;gap:6px}
.attchips span{display:inline-flex;gap:6px;align-items:center}
.attchips button{border:0;background:none;color:var(--muted);cursor:pointer;padding:0;font-size:14px}
#askq{width:100%;min-height:64px;max-height:180px;resize:vertical;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.askrow{display:flex;gap:8px;align-items:center}
.askrow .sp{flex:1}
.askrow .hint{font-size:12px;color:var(--muted)}
@media (max-width:560px){
  .crest img{width:58px;height:58px}
  .next{grid-template-columns:1fr}
  .datebox{width:auto;display:flex;gap:8px;align-items:baseline;justify-content:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script id="wolves-app">
(function(){
'use strict';
var DATA_EL=document.getElementById('wolves-data');
var LOGO=document.getElementById('wolves-logo').textContent.trim();
var STYLE_SRC=document.getElementById('wolves-style').textContent;
var APP_SRC=document.getElementById('wolves-app').textContent;
var RESET=':root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}';

var data;
try{data=JSON.parse(DATA_EL.textContent)}catch(e){data={}}
var DEF={rev:0,settings:{season:'2026-27',league:'',duesMode:'Follow the budget',dues:'',ptShare:'50',subFee:'',hostRinks:'Morinville=225, Silent Ice=358',gst:'5',slotHours:'2.25',refFee:'120',refsPerGame:'2',refInsurance:'20',hostIcePaidBy:'',extraHomeGames:'0',extraHomeRink:'Morinville',practices:'',practiceHours:'1',refGames:'6',feeBuffer:'0',tkPerGame:'2'},roster:[],subUses:[],payments:[],ice:[],icePay:[],refs:[],games:[],beer:[],tk:[],budget:[],contacts:[]};
/* roster types: Full time, Part time, Sub (older Regular/Spare/Injured and the old separate sub list fold in) */
function rosterType(p){var s=(p&&p.status)||'Full time';return s==='Regular'||s==='Injured'?'Full time':s==='Spare'?'Sub':s}
/* fill defaults and fold in older data shapes; runs on load and on every copy that arrives from the cloud */
function prep(){
Object.keys(DEF).forEach(function(k){if(data[k]==null)data[k]=JSON.parse(JSON.stringify(DEF[k]))});
['duesMode','ptShare','subFee','hostRinks','gst','slotHours','refFee','refsPerGame','refInsurance','hostIcePaidBy','extraHomeGames','extraHomeRink','practices','practiceHours','refGames','feeBuffer','tkPerGame'].forEach(function(k){if(data.settings[k]==null)data.settings[k]=DEF.settings[k]});
if(data.settings.hostRinks==='Morinville, Silent Ice')data.settings.hostRinks=DEF.settings.hostRinks;
data.roster.forEach(function(p){p.status=rosterType(p)});
if(data.subs){data.subs.forEach(function(s){if(!data.roster.some(function(p){return p.id===s.id}))data.roster.push({id:s.id,name:s.name,number:'',pos:s.pos||'',status:'Sub',phone:s.phone||'',email:s.email||'',dues:'',notes:s.notes||''})});delete data.subs}
data.subUses.forEach(function(u){if(u.subId&&!u.playerId){u.playerId=u.subId}delete u.subId});
data.games.forEach(function(g){delete g.gf;delete g.ga;if(g.status==='Final')g.status='Played';if(/^Score not entered yet\.\s*/.test(g.notes||''))g.notes=g.notes.replace(/^Score not entered yet\.\s*/,'')});
}
prep();
var baseRev=data.rev||0;
setTimeout(function(){var a=data.games.map(syncHomeAway).some(Boolean),b=data.games.map(applyHostIce).some(Boolean);if((a||b)&&typeof render==='function')render()},0);

var editor=false, preview=false, artifactNS=null, assetsNS=null, dirty=0, modal=null, tab='overview';
var TABS=[['overview','Overview'],['schedule','Schedule'],['roster','Roster'],['payments','Player Payments'],['subs','Subs'],['ice','Ice'],['refs','Refs'],['budget','Budget'],['owed','Owed Back'],['gamesheets','Gamesheets'],['beer','Beer'],['timekeepers','Timekeepers'],['contacts','Contacts']];

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
function num(v){var n=parseFloat(v);return isFinite(n)?n:0}
function money(n){n=num(n);var neg=n<0;n=Math.abs(n);return (neg?'−$':'$')+n.toLocaleString('en-CA',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})}
function sum(arr,f){return arr.reduce(function(a,x){return a+num(typeof f==='function'?f(x):x[f])},0)}
var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pd(d){if(!d)return null;var p=d.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function fdate(d){var x=pd(d);return x?DOW[x.getDay()]+' '+MON[x.getMonth()]+' '+x.getDate():'Date TBD'}
function ftime(t){if(!t)return '';var p=t.split(':').map(Number),h=p[0];return (h%12||12)+':'+String(p[1]||0).padStart(2,'0')+(h>=12?' PM':' AM')}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function byId(c,id){return data[c].find(function(x){return x.id===id})}
function gamesSorted(){return data.games.slice().sort(function(a,b){return ((a.date||'9')+(a.time||'')).localeCompare((b.date||'9')+(b.time||''))})}
function gameLabel(g){if(!g)return 'Unknown game';return fdate(g.date)+' · '+(g.ha==='Away'?'@ ':'vs ')+(g.opponent||'TBD')}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function canEditNow(){return editor&&!preview}

/* ---------- refs: standard fee each + mileage when it applies + one-time insurance on a ref's first game with us ---------- */
function refKey(r){return String(r.name||'').trim().toLowerCase().replace(/\s+/g,' ')}
function refWhen(r){var g=byId('games',r.gameId)||{};return (g.date||'9999')+(g.time||'')+r.id}
function refBaseFee(r){return r.fee!==''&&r.fee!=null?num(r.fee):num(data.settings.refFee)}
function refIsFirst(r){
  var k=refKey(r);if(!k)return false;
  var mine=data.refs.filter(function(x){return refKey(x)===k});
  if(mine.some(function(x){return x.insured}))return false;
  return mine.sort(function(a,b){return refWhen(a).localeCompare(refWhen(b))})[0]===r;
}
function refInsurance(r){return refIsFirst(r)?num(data.settings.refInsurance):0}
function refOwed(r){var g=byId('games',r.gameId);if(g&&!isHosted(g))return 0;return round2(refBaseFee(r)+num(r.mileage)+refInsurance(r))}
function refBreakdown(r){var p=[money(refBaseFee(r))+' fee'];if(num(r.mileage))p.push(money(r.mileage)+' mileage');if(refInsurance(r))p.push(money(refInsurance(r))+' first-game insurance');return p.join(' + ')}
function refUnpaid(r){return num(r.amountPaid)<refOwed(r)}

    if(code==='conflict')toast('A newer version was saved somewhere else. Reloading it now.');

  }

function resolveRef(c,v){

function normVal(f,v){

function saveRecords(c,recs){

      S[c].f.forEach(function(f){if(r[f[0]]!==undefined)o[f[0]]=normVal(f,r[f[0]])});
      if(ex){Object.assign(ex,o);saved.push({id:ex.id,label:labelOf(c,ex),updated:Object.keys(o)});return}

  'Notes: payments = season fee payments from roster players. icePay = payments the team made to rinks. refs = one official per record with fee, amountPaid and paidBy (who handed over the money). subUses = a Sub-type roster player playing one game and their fee. tk = whose turn it is to be responsible for bringing a timekeeper to a HOME game (gameId, responsible = roster player, timekeeper = the person they bring, if known); only home games need one, and the next turn goes to the non-sub player with the fewest past turns. This is the volunteer commitment for players: settings.tkPerGame (2) players per home game, taken in turn by full-time and part-time players with the fewest turns; not everyone has to get a turn. Skip anyone with roster.volExempt true ('+data.roster.filter(function(p){return p.volExempt}).map(function(p){return p.name}).join(', ')+'). Never assign an exempt player. beer = whose turn it is to bring beer to a game (gameId, bringer, note). Beer is a turn rotation only: never record or ask about beer costs or reimbursements. To suggest who is next, pick the non-sub roster player with the fewest past turns. Affiliate players (APs) cost $100 each to bring in. The budget has no AP line (she removed it); do not add one unless she asks. Budget categories: expenses '+CATS.Expense.join(', ')+'; income '+CATS.Income.join(', ')+'. Ice, Referees, Player dues and Sub fees actuals fill in automatically from the trackers, so do not put actuals on those budget lines.';
}

function mdLite(t){
  var lines=esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').split('\n'),out='',inList=false;
  lines.forEach(function(l){var m=l.match(/^\s*[-•*]\s+(.*)/);if(m){if(!inList){out+='<ul>';inList=true}out+='<li>'+m[1]+'</li>';return}if(inList){out+='</ul>';inList=false}if(l.trim())out+='<p>'+l+'</p>'});
  return out+(inList?'</ul>':'');
}

function undoTurn(i){var m=ask.log[i];if(!m||!m.undo)return;data=JSON.parse(m.undo);delete m.undo;ask.log.push({who:'note',text:'Changes from that answer were undone.'});changed();renderLog()}
async function sendAsk(){
  var box=document.getElementById('askq'),q=box.value.trim();
  if(ask.busy||(!q&&!ask.files.length&&!ask.docRefs.length))return;
  ask.busy=true;setBusy(true);
  var files=ask.files.splice(0),refs=ask.docRefs.splice(0);renderChips();box.value='';
  ask.log.push({who:'me',text:q||'Here are some files.',files:files.map(function(f){return f.name}).concat(refs.map(function(d){return d.name}))});
  var ai={who:'ai',text:'',status:files.length?'Reading files…':'Thinking…'};ask.log.push(ai);renderLog();
  var images=[],att=[],budget=140000,maxImg=(sampleCaps&&sampleCaps.images&&sampleCaps.images.maxCount)||0;
  for(var i=0;i<files.length;i++){
    var f=files[i];ai.status='Reading '+f.name+'…';renderLog();
    try{
      var ex=await extract(f),d=await storeFile(f,ex),t=d.text.slice(0,Math.max(0,Math.min(60000,budget)));budget-=t.length;
      images=images.concat(ex.images);
      att.push('[doc id '+d.id+'] '+f.name+' ('+(KIND[ex.kind]||ex.kind)+(ex.scanned?', scanned: page images attached':'')+(ex.kind==='image'?': image attached':'')+')'+(t?'\n'+t+(d.text.length>t.length?'\n[cut here; use read_doc with offset '+t.length+' for the rest]':''):''));
    }catch(e){ask.log.splice(ask.log.length-1,0,{who:'note',text:e.message});att.push('(Could not read '+f.name+': '+e.message+')')}
  }
  refs.forEach(function(d){var t=(d.text||'').slice(0,Math.max(0,Math.min(40000,budget)));budget-=t.length;att.push('[doc id '+d.id+'] '+d.name+' (stored earlier)'+(d.summary?'\nSummary: '+d.summary:'')+(t?'\n'+t:''))});
  if(images.length>maxImg){ask.log.splice(ask.log.length-1,0,{who:'note',text:maxImg?'Only the first '+maxImg+' images were sent to Claude.':'Photos cannot be sent from this view, so Claude only gets the file names.'});images=images.slice(0,maxImg)}
  var content=(q||'I attached these files. Tell me what they are and add what belongs in the dashboard.')+(att.length?'\n\nAttached files:\n\n'+att.join('\n\n'):'');
  ask.turns.push({role:'user',content:content});
  while(ask.turns.length>12)ask.turns.shift();
  while(ask.turns.length&&ask.turns[0].role!=='user')ask.turns.shift();
  var snap=JSON.stringify(data);
  ai.status='Thinking…';renderLog();
  ask.ctl=new AbortController();
  var opts={tools:tools(),signal:ask.ctl.signal,onText:function(u){ai.text=u.text;ai.status='';renderLog()}};
  if(images.length)opts.images=images;
  try{
    var r=await sampleNS([{role:'user',content:rules()}].concat(ask.turns),opts);
    ai.text=r.text;ask.turns.push({role:'assistant',content:r.text});
    if(r.truncated)ai.err='The answer was cut short. Ask for less at a time.';
  }catch(e){
    ai.text=e.text||'';
    if(e&&e.code!=='cancelled')ai.err=ERR[e&&e.code]||'Something went wrong reaching Claude. Try again.';
    else ai.err='Stopped.';
    if(ai.text)ask.turns.push({role:'assistant',content:ai.text});
  }
  ai.status='';
  if(JSON.stringify(data)!==snap){ask.log.forEach(function(m){if(m!==ai)delete m.undo});ai.undo=snap}
  ask.busy=false;ask.ctl=null;setBusy(false);renderLog();
}
